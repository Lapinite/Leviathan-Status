<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="440" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="438" rx="23" fill="none" stroke="#173b51"/><text x="42" y="44" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN STATUS // INCIDENT LIFECYCLE</text><text x="42" y="68" fill="#7d9fb2" font-family="Segoe UI,Arial" font-size="12">Public status communication follows user impact from first signal through recovery and useful follow-up.</text><path id="p" d="M95 220 H1105" fill="none" stroke="#174c66" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#63f2ff" filter="url(#g)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g><circle cx="120" cy="220" r="44" fill="#071a26" stroke="#5a7181" stroke-width="2"/><text x="120" y="215" fill="#eefcff" font-size="13" font-weight="750">SIGNAL</text><text x="120" y="233" fill="#7f9fb0" font-size="9">detected</text></g><g><circle cx="295" cy="220" r="44" fill="#071a26" stroke="#ff9f43" stroke-width="2"/><text x="295" y="211" fill="#eefcff" font-size="12" font-weight="750">IMPACT</text><text x="295" y="228" fill="#eefcff" font-size="12" font-weight="750">CONFIRMED</text></g><g><circle cx="470" cy="220" r="44" fill="#071a26" stroke="#ff7b5c" stroke-width="2"/><text x="470" y="215" fill="#eefcff" font-size="13" font-weight="750">INCIDENT</text><text x="470" y="233" fill="#7f9fb0" font-size="9">opened</text></g><g><circle cx="645" cy="220" r="44" fill="#071a26" stroke="#8174ff" stroke-width="2"/><text x="645" y="211" fill="#eefcff" font-size="12" font-weight="750">MITIGATION</text><text x="645" y="228" fill="#eefcff" font-size="12" font-weight="750">IN PROGRESS</text></g><g><circle cx="820" cy="220" r="44" fill="#071a26" stroke="#20bfdd" stroke-width="2"/><text x="820" y="211" fill="#eefcff" font-size="12" font-weight="750">RECOVERY</text><text x="820" y="228" fill="#eefcff" font-size="12" font-weight="750">VALIDATED</text></g><g><circle cx="995" cy="220" r="44" fill="#071a26" stroke="#43d9a3" stroke-width="2"/><text x="995" y="215" fill="#eefcff" font-size="13" font-weight="750">RESOLVED</text><text x="995" y="233" fill="#7f9fb0" font-size="9">public state</text></g><g><circle cx="1100" cy="220" r="44" fill="#061a28" stroke="#36e4f7" stroke-width="2.5" filter="url(#g)"/><text x="1100" y="211" fill="#eefcff" font-size="11" font-weight="750">HISTORY</text><text x="1100" y="228" fill="#eefcff" font-size="11" font-weight="750">FOLLOW-UP</text></g></g><text x="600" y="345" text-anchor="middle" fill="#65889b" font-family="ui-monospace,Consolas,monospace" font-size="10">USER IMPACT FIRST • TIMESTAMPED UPDATES • NO PRIVATE HOSTS, DATABASE DETAILS OR SENSITIVE TOPOLOGY</text><rect x="4" y="4" width="1192" height="432" rx="22" fill="none" stroke="#0b3346" stroke-width="1.5"/><rect x="4" y="4" width="1192" height="432" rx="22" fill="none" stroke="#32efff" stroke-width="3" stroke-dasharray="390 1520" filter="url(#g)" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-1910" dur="9s" repeatCount="indefinite"/></rect></svg>