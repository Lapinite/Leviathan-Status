<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="300" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#173b51"/><text x="40" y="42" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="14" letter-spacing="2.6">LEVIATHAN STATUS // INCIDENT COMMUNICATION FLOW</text><text x="40" y="64" fill="#7899ac" font-family="Segoe UI,Arial" font-size="11">Public updates move from signal detection to impact confirmation, mitigation, recovery validation and history.</text><path id="p" d="M85 160 H1115" fill="none" stroke="#165d79" stroke-width="3"/><circle r="5" fill="#67f2ff" filter="url(#g)"><animateMotion dur="8.2s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g transform="translate(100 160)"><circle r="34" fill="#061722" stroke="#4c6473"/><text y="0" fill="#eefcff" font-size="10">SIGNAL</text><text y="16" fill="#7898aa" font-size="9">detected</text></g><g transform="translate(270 160)"><circle r="38" fill="#061722" stroke="#22bddb"/><text y="0" fill="#eefcff" font-size="10">IMPACT</text><text y="16" fill="#7898aa" font-size="9">confirmed</text></g><g transform="translate(445 160)"><circle r="38" fill="#061722" stroke="#ff9f43"/><text y="0" fill="#eefcff" font-size="10">INCIDENT</text><text y="16" fill="#7898aa" font-size="9">opened</text></g><g transform="translate(625 160)"><circle r="40" fill="#061722" stroke="#ff9f43"/><text y="0" fill="#eefcff" font-size="10">MITIGATION</text><text y="16" fill="#7898aa" font-size="9">investigation</text></g><g transform="translate(815 160)"><circle r="40" fill="#061722" stroke="#35e8f8"/><text y="0" fill="#eefcff" font-size="10">RECOVERY</text><text y="16" fill="#7898aa" font-size="9">validation</text></g><g transform="translate(990 160)"><circle r="38" fill="#061722" stroke="#43d9a3"/><text y="0" fill="#eefcff" font-size="10">RESOLVED</text><text y="16" fill="#7898aa" font-size="9">confirmed</text></g><g transform="translate(1110 160)"><circle r="36" fill="#061722" stroke="#8174ff"/><text y="0" fill="#eefcff" font-size="10">HISTORY</text><text y="16" fill="#7898aa" font-size="9">follow-up</text></g></g><text x="600" y="245" text-anchor="middle" fill="#66899c" font-family="ui-monospace,Consolas,monospace" font-size="9">PUBLIC COMMUNICATION FOCUSES ON USER IMPACT WITHOUT EXPOSING PRIVATE INFRASTRUCTURE</text></svg>